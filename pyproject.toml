[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-stack-resolver"
version = "0.1.0"
description = "Benchmark baseline and amendment-aware insurance contract stack resolver"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "openai>=2,<3",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "rank-bm25>=0.2.2,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.13.1,<3", "pytest>=8,<10"]

[project.scripts]
contract-stack = "contract_stack.cli:main"
contract-stack-api = "contract_stack.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_stack = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
